name: signals

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may delay runs a few minutes)
  workflow_dispatch:         # lets you start it manually from the Actions tab

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # remembers which setups were already sent, so you never get duplicates
      - uses: actions/cache@v4
        with:
          path: sent_signals.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
